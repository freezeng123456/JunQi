# v36_bugfixes_100R — first post-audit training on H20.
#
# Shakedown run validating all 2026-05-11 bug fixes on a single H20:
#   F-1  BeliefNetConfig.n_encoder_layer (not 'depth')        — no launch crash
#   F-3  lr_schedule_unit: rollout                             — lr stays at ceil 1500R
#   F-6  reward_shaping togglable via cfg                      — kept ON for baseline
#   F-7  no PYTORCH_CUDA_ALLOC_CONF=expandable_segments         — via launch script
#   BUG-J  reward shaping no longer stacks on terminal reward  — gpu_collector
#   BUG-K  ArrNet credits both own-team seats (vs-random)      — train.py
#   BUG-L  ArrNet process_data stats now reach the logger      — train.py
#   BUG-N  BeliefBuffer labels use CURRENT piece positions     — reveal_tracker
#   BUG-O  belief upload no longer zeros non-enemy cells       — inference.py
#   F-4  train_value_on_random_seats=false (empirically best)  — rollout_gpu
#
# Relative to v35_ddp_combat_memory (H20 2-card DDP, global num_envs=768):
#   * Single-GPU, num_envs=128 (fits the ~27 GB free on the shared H20)
#   * total_rollouts=100 (diagnostic run; full run later if numbers look good)
#   * eval_every=5 (20 eval points) so we can see the win-rate trajectory

env:
  num_envs: 256
  steps_per_env: 512
  max_num_moves: 4000
  seed: 136
  use_gpu_rollout: true

net:
  cnn_channels: 96
  cnn_layers: 3
  depth: 6
  embed_dim: 192
  n_head: 6
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: true
  action_key_dim: 48
  pos_emb_std: 0.02

belief:
  enabled: true
  buffer_capacity: 50000
  ema_decay: 0.999
  infer_chunk_size: 256
  refresh_every: 5
  warmup_rollouts: 20   # reduced from 100 so belief kicks in earlier during the 100R run
  net:
    n_encoder_layer: 6   # F-1 field name
    embed_dim: 512
    n_head: 8
    ff_factor: 4
    dropout: 0.1
  ppo: null

arr:
  enabled: true
  n_arr: 1024
  refresh_every: 1
  storage_duration: 300
  ema_decay: 0.999
  reg_norm: 10.0
  reg_temp_init: 0.1
  reg_temp_floor: 0.0
  reg_temp_decay: 0.3
  net:
    depth: 4
    dropout: 0.0
    embed_dim: 512
    ff_factor: 4
    n_head: 8
    n_vf_cat: 3
    pos_emb_std: 0.1
    use_cat_vf: true
  ppo:
    autocast_dtype: bfloat16
    batch_size: 256
    clip_range: 0.2
    ent_pred_coef: 0.5
    kl_coef: 0.1
    lr: 0.0003
    max_grad_norm: 0.5
    num_epoch_per_train: 4
    policy_coef: 1.0
    vf_coef: 0.5
    weight_decay: 0.0

ppo:
  clip_range: 0.2
  vf_coef: 1.0
  policy_coef: 1.0
  temperature_coef: 0.05
  temperature_ceil: 0.1
  temperature_floor: 0.001
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.1
  gamma: 1.0
  gae_lambda: 0.5
  td_lambda: 0.8
  adv_filt_thresh: 0.01
  adv_filt_rate: 0.75
  lr_coef: 0.5
  lr_decay: 1.1
  lr_ceil: 1.0e-4
  lr_floor: 5.0e-6
  lr_schedule_unit: "rollout"   # F-3
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.999
  num_epochs_per_rollout: 4
  minibatch_size: 1024
  dtype: "bfloat16"
  torch_compile: false

save_dir: "exps/v36_bugfixes_100R"
total_rollouts: 100
save_every: 25
eval_every: 5
log_every: 2

# Disable early-stop for this diagnostic run.
early_stop_min_rollout: 2000
early_stop_patience: 5
early_stop_win_rate: 0.0

use_wandb: false
seed: 136
device: "cuda"
torch_deterministic: false
resume: ""

random_opponent: true
train_value_on_random_seats: false  # F-4 default (empirically best)
reward_shaping: true                 # F-6 default (matching v35 baseline)

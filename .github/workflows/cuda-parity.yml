name: CUDA parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths:
      - "build_cuda.py"
      - "junqi_core/**"
      - "junqi_rl/**"
      - "src/env/cuda/**"
      - "tests/test_gpu_*.py"
      - "tests/test_legal_actions_gpu*.py"
      - "tests/test_compact_rollout_history.py"
      - ".github/workflows/cuda-parity.yml"

permissions:
  contents: read

jobs:
  cuda-parity:
    name: Build CUDA extension and run parity tests
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[rl,dev]"
      - run: python build_cuda.py
      - name: Verify CUDA extension schema
        run: >-
          python -c "import junqi_cuda;
          from junqi_core.board import COMPACT_ACTION_DIM;
          from junqi_core.observation import OBS_CHANNELS;
          assert junqi_cuda.get_gpu_count() > 0;
          assert junqi_cuda.NUM_OBS_CHANNELS == OBS_CHANNELS,
          (junqi_cuda.NUM_OBS_CHANNELS, OBS_CHANNELS);
          assert junqi_cuda.FLAT_ACTION_SPACE == COMPACT_ACTION_DIM,
          (junqi_cuda.FLAT_ACTION_SPACE, COMPACT_ACTION_DIM)"
      - name: CUDA correctness and parity
        run: >-
          python -m pytest -q
          tests/test_gpu_combat_memory_parity.py
          tests/test_gpu_obs_parity.py
          tests/test_gpu_step_batch.py
          tests/test_gpu_engineer_adversarial.py
          tests/test_gpu_csr_mask.py
          tests/test_legal_actions_gpu.py
          tests/test_compact_rollout_history.py

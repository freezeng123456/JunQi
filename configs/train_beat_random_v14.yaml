# configs/train_beat_random_v14.yaml
#
# v14: 256-channel observation (piece_id + move_history + pruned redundant channels).
# Hyperparameters: use v12's PROVEN settings that reached 65% win rate.
# Only the observation layout changed; training dynamics stay the same.
#
# Changes from v12 observation:
#   - DARK mode (四暗): teammate channels 12-23 are belief distributions
#   - Bucket channels: D-3 filter removed; all enemy stats visible
#   - death_reason: 4-way split (me/teammate/left/right) → 12ch
#   - Removed: is_my_turn (always 1), game_phase (redundant), dead_flags[me] (always 0)
#   - Added: piece_id (120ch one-hot identity tracking)
#   - Added: move_history (32ch src_dst_planes)
#   - Total: 256 channels (was 101)

env:
  num_envs: 128
  steps_per_env: 512
  max_num_moves: 4000
  seed: 42
  use_gpu_rollout: true

net:
  cnn_channels: 64
  cnn_layers: 2
  depth: 4
  embed_dim: 128
  n_head: 4
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: true
  action_key_dim: 32

ppo:
  # --- v12 proven settings ---
  clip_range: 0.15
  vf_coef: 1.5
  policy_coef: 1.0

  # --- Entropy / temperature (v12) ---
  temperature_coef: 0.02
  temperature_ceil: 0.05
  temperature_floor: 0.0005
  temperature_decay: 0.3
  uniform_magnet: true

  # --- No KL (v12) ---
  kl_coef: 0.0

  # --- GAE (v12) ---
  gamma: 1.0
  gae_lambda: 0.80
  td_lambda: 0.90

  # --- No advantage filtering (v12) ---
  adv_filt_rate: 0.0
  adv_filt_thresh: 0.0

  # --- Optimizer (v12-equivalent with corrected power_schedule formula) ---
  # v12 used lr_decay=10 with OLD formula coef/(1+t)^(1/decay) = coef/(1+t)^0.1
  # New formula is coef/(1+t)^decay, so lr_decay=0.1 gives the same trajectory.
  lr_coef: 0.5
  lr_decay: 0.1
  lr_ceil: 5.0e-4
  lr_floor: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 0.5

  # --- EMA (v12) ---
  ema_decay: 0.995

  # --- Training schedule ---
  num_epochs_per_rollout: 4
  minibatch_size: 512
  dtype: "float16"
  torch_compile: false

save_dir: "exps/beat_random_v14"
total_rollouts: 2000
save_every: 50
eval_every: 10
log_every: 5

use_wandb: false
seed: 42
device: "cuda"
torch_deterministic: false

# Ataraxos-aligned run: self-play from scratch, setup net and move net
# trained in tandem from the first rollout.
#
# Deliberate alignment choices, each a departure from the vs-random baseline:
#   * random_opponent: false  — self-play from rollout 0, no warm start.
#   * arr.enabled: true       — the setup net learns alongside the move net.
#   * reward_shaping: false   — terminal +-1 only. The piece-loss penalties
#     only ever punish combat that goes badly, which trains a policy that
#     refuses to engage: measured 97-100% draws in mirror play against 0.8%
#     for the same recipe without shaping.
#   * belief.enabled: false   — the paper adds the belief net after move and
#     setup are training together; it goes back on in a later phase.
#
# h2h scores against the no-shaping vs-random checkpoint, which is the
# strongest opponent we have that actually fights.

env:
  # The paper's top-25% filter needs a batch to cut from. At 128 envs it
  # left 16,384 transitions per update and ran ~80 Elo behind the top-75%
  # filter at equal rollouts. Measured on one H20 (fps / post-filter batch):
  # 128 -> 12.1k / 16k, 512 -> 25.6k / 66k, 2048 -> 30.8k / 262k at 39.5 GiB
  # of 97.8. Throughput saturates around 512, but the post-filter batch is
  # what was binding, so take the 2048 rung.
  num_envs: 2048
  steps_per_env: 512
  max_num_moves: 4000
  seed: 241
  use_gpu_rollout: true

net:
  # ~10.8M move net (was 1.13M: d=4 e=128 cnn=64×2 k=32).
  cnn_channels: 128
  cnn_layers: 3
  depth: 8
  embed_dim: 320
  n_head: 8
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: true
  action_key_dim: 64
  pos_emb_std: 0.02

ppo:
  # Ataraxos computes one 0.75-quantile threshold from all valid positions
  # in this rank's rollout, then trains the surviving positions one simulator
  # row at a time. A row may therefore keep more/fewer than exactly 25%.
  minibatch_group: timestep
  adv_filter_scope: rollout
  num_epochs_per_rollout: 1
  minibatch_size: 512
  dtype: bfloat16
  # torch.compile under self-play is a documented crash path (DDP_DEPLOYMENT.md).
  torch_compile: false
  lr_schedule_unit: rollout
  # Exploration-preserving departure from the paper coefficient:
  # alpha(t) = 0.1 / t^0.3 on the rollout index, with no floor.
  temperature_schedule_unit: rollout
  temperature_coef: 0.1
  temperature_decay: 0.3
  temperature_floor: 0.0
  # Keep the current exploration target explicit. This is the public-code
  # style flat legal-action magnet, not the paper's piece-then-destination rho.
  magnet_shape: uniform_legal
  # Split collect ``policy.act`` so 2048 envs fit the ~10M net.
  act_chunk_size: 256
  max_grad_norm: 0.267
  # Ataraxos trains on the top 25% of transitions by |advantage|. This
  # field is the fraction KEPT, so the previous 0.75 trained on the top
  # 75% -- the inverse -- diluting every update with low-signal samples.
  adv_filt_rate: 0.25
  adv_filt_thresh: 0.01
  # PPO always evaluates the frozen collection policy over the complete legal
  # action support, preserving Ataraxos's full reverse-KL objective.

arr:
  enabled: true
  # Paper: 1000 setups / player / GPU, independently sampled per seat.
  # Zip pairing of n_arr=1024 previously uploaded only 256 combined
  # boards, so 2048 envs reused the same 256 openings. Generate 1024
  # lineups per seat and expand to a 16384-board pool by independently
  # re-pairing seats (CUDA hashes each env onto one combined row).
  n_arr: 4096
  pool_size: 16384

belief:
  enabled: false

rollout:
  storage_mode: compact_history
  csr_legal_mask: true
  csr_k_max: 256

save_dir: exps/ataraxos_selfplay
total_rollouts: 3000
save_every: 100
eval_every: 25
eval_num_games: 128
eval_record_games: 0
league_eval_games: 0
log_every: 10

# Yardstick is the previous from-scratch 1.13M run's final weights.
# Report h2h as win/loss/draw; vs-random is saturated and not for decisions.
eval_baseline_ckpt: /jizhicfs/freezeng123456/JunQi-runs/ataraxos_bigbatch_20260818/ckpt_003000.pt
eval_baseline_games: 128

device: cuda
seed: 241
random_opponent: false
train_value_on_random_seats: false
reward_shaping: false
mixed_setup: false

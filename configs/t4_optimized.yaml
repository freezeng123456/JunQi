# configs/t4_optimized.yaml — T4 config with all performance optimizations
#
# Changes vs t4_smoke.yaml:
# - num_envs: 256 (higher parallelism, GPU better utilized)
# - dtype: float16 (T4 Tensor Cores, 65 TFLOPS vs 8.1 fp32)
# - torch_compile: true (operator fusion + CUDA graph capture)
# - Network uses compact 130-token sequence (129 on-board cells)
# - fp16 obs buffer, 16641-dim compact action space
#
# Expected: ~21 games/s with medium net, ~7 games/s with production net

# ── Environment ───────────────────────────────────────────────────────────
env:
  num_envs: 256          # 256 envs — optimal for T4 with compact actions
  steps_per_env: 128     # 128 steps per env per rollout
  max_num_moves: 4000
  seed: 42
  use_gpu_rollout: true

# ── Network (medium, good balance speed/capacity) ─────────────────────────
net:
  cnn_channels: 64
  cnn_layers: 2
  depth: 4               # 4 transformer blocks
  embed_dim: 128          # 128-d embedding
  n_head: 4
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: false
  action_key_dim: 32

# ── PPO ───────────────────────────────────────────────────────────────────
ppo:
  clip_range: 0.2
  vf_coef: 1.0
  policy_coef: 1.0
  temperature_coef: 0.05
  temperature_ceil: 0.1
  temperature_floor: 0.001
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.1
  # Preserve the complete frozen-policy reverse KL. The training forward still
  # uses supplied rollout actions and avoids throwaway action sampling.
  gamma: 1.0
  gae_lambda: 0.5
  td_lambda: 0.8
  adv_filt_thresh: 0.01
  adv_filt_rate: 0.75
  lr_coef: 0.5
  lr_decay: 1.1
  lr_ceil: 2.0e-4
  lr_floor: 5.0e-6
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.999
  num_epochs_per_rollout: 3
  minibatch_size: 512
  dtype: "float16"          # T4 Tensor Cores (65 TFLOPS fp16)
  torch_compile: true       # operator fusion + CUDA graph

# ── Run logistics ─────────────────────────────────────────────────────────
save_dir: "exps/t4_opt"
total_rollouts: 5000
save_every: 100
eval_every: 50
log_every: 10

# ── Logging ───────────────────────────────────────────────────────────────
use_wandb: false
wandb_project: "junqi-rl"
wandb_run_name: "t4-opt-v1"

# ── Misc ──────────────────────────────────────────────────────────────────
seed: 42
device: "cuda"
torch_deterministic: false

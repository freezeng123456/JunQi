# configs/train_beat_random_v12.yaml
# Fix v11 VF non-convergence:
#   v11 problem: gae_lambda=0.95 produces high-variance returns → VF loss stuck at 0.88 for 100+ rollouts
#   v11 problem: temperature_coef=0.05 too high → policy too diffuse, can't specialise
#   1. gae_lambda=0.80  — lower variance returns, VF can actually learn
#   2. temperature_coef=0.02  — lower entropy, let policy specialise (same as v10)
#   3. vf_coef=1.5  — still stronger than v10 (1.0) but not as extreme as v11 (2.0)
#   4. clip_range=0.15  — slightly relaxed from v11 (0.1) to give policy more room
#   Keep: kl_coef=0.0, own-seat-only adv norm, pure terminal reward
env:
  num_envs: 128
  steps_per_env: 512
  max_num_moves: 4000
  seed: 42
  use_gpu_rollout: true

net:
  cnn_channels: 64
  cnn_layers: 2
  depth: 4
  embed_dim: 128
  n_head: 4
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: true
  action_key_dim: 32

ppo:
  clip_range: 0.15                 # Slightly relaxed vs v11 (0.1) — more room to learn
  vf_coef: 1.5                     # Stronger than v10 (1.0), less extreme than v11 (2.0)
  policy_coef: 1.0
  temperature_coef: 0.02           # Back to v10 level — let policy specialise
  temperature_ceil: 0.05
  temperature_floor: 0.0005
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.0                     # No KL penalty vs random opponent
  gamma: 1.0
  gae_lambda: 0.80                 # Lower variance than v11 (0.95) — VF can converge
  td_lambda: 0.90
  adv_filt_thresh: 0.0
  adv_filt_rate: 0.0
  lr_coef: 0.5
  lr_decay: 10.0
  lr_ceil: 5.0e-4
  lr_floor: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.995
  num_epochs_per_rollout: 4
  minibatch_size: 512
  dtype: "float16"
  torch_compile: false

save_dir: "exps/beat_random_v12"
total_rollouts: 2000
save_every: 50
eval_every: 10
log_every: 5

use_wandb: false
seed: 42
device: "cuda"
torch_deterministic: false

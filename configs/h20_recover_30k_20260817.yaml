# H20 recovery long run — 30,000 rollouts on a single H20.
# v32 reached 1500R with final win_rate 0.711 (no improvement vs v25's
# 500R). But v32's lr hit floor (5e-6) by R600 and was effectively
# "polishing" for 900R. This experiment doubles it again to 30000R to
# confirm the polishing phase really is useless — if win_rate stays flat,
# the 0.80 ceiling is definitely data-saturated, not compute-limited.
#
# Diff from exp1:
#   - total_rollouts: 500 -> 30000 (6x H20 exp1, 2x v32)
#   - lr_decay: 1.1 -> 0.8 (slower decay so lr doesn't floor too early)
#   - rest identical
arr:
  ema_decay: 0.999
  enabled: true
  n_arr: 1024
  net:
    depth: 4
    dropout: 0.0
    embed_dim: 512
    ff_factor: 4
    n_head: 8
    n_vf_cat: 3
    pos_emb_std: 0.1
    use_cat_vf: true
  ppo:
    autocast_dtype: bfloat16
    batch_size: 256
    clip_range: 0.2
    ent_pred_coef: 0.5
    kl_coef: 0.1
    lr: 0.0003
    max_grad_norm: 0.5
    num_epoch_per_train: 4
    policy_coef: 1.0
    vf_coef: 0.5
    weight_decay: 0.0
  refresh_every: 1
  reg_norm: 10.0
  reg_temp_decay: 0.3
  reg_temp_floor: 0.0
  reg_temp_init: 0.1
  storage_duration: 300
belief:
  buffer_capacity: 50000
  ema_decay: 0.999
  enabled: false
  infer_chunk_size: 256
  net: null
  ppo: null
  refresh_every: 5
  warmup_rollouts: 100
device: cuda
early_stop_min_rollout: 1000
early_stop_patience: 3
early_stop_win_rate: 1.0
env:
  max_num_moves: 4000
  num_envs: 256
  seed: 170817
  steps_per_env: 1024
  use_gpu_rollout: true
eval_num_games: 256
eval_record_games: 1
eval_record_beliefs: false
league_eval_games: 16
eval_every: 100
log_every: 10
net:
  action_key_dim: 32
  cnn_channels: 64
  cnn_layers: 2
  depth: 4
  dropout: 0.0
  embed_dim: 128
  ff_factor: 4
  n_head: 4
  pos_emb_std: 0.02
  use_cat_vf: true
ppo:
  adv_filt_rate: 0.75
  adv_filt_thresh: 0.01
  clip_range: 0.2
  dtype: bfloat16
  ema_decay: 0.999
  gae_lambda: 0.5
  gamma: 1.0
  kl_coef: 0.1
  lr_ceil: 0.0001
  lr_coef: 0.5
  lr_decay: 0.8
  lr_floor: 5.0e-06
  max_grad_norm: 0.267
  minibatch_size: 2048
  net:
    action_key_dim: 32
    cnn_channels: 64
    cnn_layers: 2
    depth: 4
    dropout: 0.0
    embed_dim: 128
    ff_factor: 4
    n_head: 4
    pos_emb_std: 0.02
    use_cat_vf: true
  num_epochs_per_rollout: 1
  policy_coef: 1.0
  td_lambda: 0.8
  temperature_ceil: 0.1
  temperature_coef: 0.05
  temperature_decay: 0.3
  temperature_floor: 0.001
  torch_compile: false
  uniform_magnet: true
  vf_coef: 1.0
  weight_decay: 0.0
random_opponent: true
resume: ''
save_dir: exps/h20_recover_30k_20260817
save_every: 100
seed: 170817
torch_deterministic: false
total_rollouts: 30000
use_wandb: false
wandb_project: junqi-rl

# Short V100 gate for the first-action-collapse repair. The run is purposely
# stopped at 20k completed games so 5k/10k/20k checkpoints can be compared.
extends: v100_ataraxos_strict.yaml

save_dir: exps/v100_ataraxos_opening_validation_v1
target_completed_games: 20000
total_rollouts: 5000
save_every_games: 5000
checkpoint_keep: 3
write_training_games: true
eval_enabled: false
eval_every_games: 20000
opening:
  enabled: false

ppo:
  # Keep a meaningful reverse-KL pull toward source-uniform exploration for
  # the entire diagnostic horizon. This is the only algorithmic change from
  # the strict run; it preserves the exact sampled-policy PPO ratio.
  temperature_coef: 0.05
  temperature_decay: 0.1
  temperature_floor: 0.015

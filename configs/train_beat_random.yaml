# configs/train_beat_random.yaml — Train until >90% win rate vs random
env:
  num_envs: 256
  steps_per_env: 128
  max_num_moves: 4000
  seed: 42
  use_gpu_rollout: true

net:
  cnn_channels: 64
  cnn_layers: 2
  depth: 4
  embed_dim: 128
  n_head: 4
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: false
  action_key_dim: 32

ppo:
  clip_range: 0.2
  vf_coef: 1.0
  policy_coef: 1.0
  temperature_coef: 0.05
  temperature_ceil: 0.1
  temperature_floor: 0.001
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.1
  gamma: 1.0
  gae_lambda: 0.5
  td_lambda: 0.8
  adv_filt_thresh: 0.01
  adv_filt_rate: 0.75
  lr_coef: 0.5
  lr_decay: 1.1
  lr_ceil: 3.0e-4
  lr_floor: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.995
  num_epochs_per_rollout: 3
  minibatch_size: 512
  dtype: "float16"
  torch_compile: false       # disable for stability during training

save_dir: "exps/beat_random"
total_rollouts: 3000
save_every: 100
eval_every: 20               # evaluate every 20 rollouts
log_every: 5

use_wandb: false
wandb_project: "junqi-rl"
wandb_run_name: "beat-random-v1"

seed: 42
device: "cuda"
torch_deterministic: false

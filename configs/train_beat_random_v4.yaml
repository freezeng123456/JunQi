# configs/train_beat_random_v4.yaml — T=512, GPU eval, random opponent
env:
  num_envs: 128            # reduce N since T is 4x larger (memory)
  steps_per_env: 512       # 512 steps ≈ 75% of avg game (683)
  max_num_moves: 4000
  seed: 42
  use_gpu_rollout: true

net:
  cnn_channels: 64
  cnn_layers: 2
  depth: 4
  embed_dim: 128
  n_head: 4
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: false
  action_key_dim: 32

ppo:
  clip_range: 0.2
  vf_coef: 1.0
  policy_coef: 1.0
  temperature_coef: 0.05
  temperature_ceil: 0.1
  temperature_floor: 0.001
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.1
  gamma: 1.0
  gae_lambda: 0.95          # higher lambda for longer horizons
  td_lambda: 0.8
  adv_filt_thresh: 0.01
  adv_filt_rate: 0.75
  lr_coef: 0.5
  lr_decay: 1.1
  lr_ceil: 3.0e-4
  lr_floor: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.995
  num_epochs_per_rollout: 4
  minibatch_size: 512
  dtype: "float16"
  torch_compile: false

save_dir: "exps/beat_random_v4"
total_rollouts: 2000
save_every: 50
eval_every: 10              # eval every 10 rollouts (GPU eval is fast now)
log_every: 5

use_wandb: false
seed: 42
device: "cuda"
torch_deterministic: false

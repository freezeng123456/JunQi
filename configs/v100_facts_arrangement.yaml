# Learned setup + move self-play; init_policy is supplied by the run card.
extends: v100_facts_games.yaml
save_dir: exps/v100_facts_arrangement
target_completed_games: 1000000
total_rollouts: 10000000
save_every_games: 10000
eval_every_games: 100000
log_every: 20
arr:
  enabled: true
  refresh_every: 8
  n_arr: 128
  pool_size: 4096
  # 4000 moves / 128 per rollout + one refresh interval.
  storage_duration: 40
  net:
    depth: 2
    n_head: 4
    embed_dim: 128
    ff_factor: 4
    dropout: 0.0
    use_cat_vf: true
  ppo:
    lr: 0.0001
    batch_size: 128
    num_epoch_per_train: 2
    autocast_dtype: float32
disable_arr_train: false
belief:
  enabled: false
disable_belief_train: true

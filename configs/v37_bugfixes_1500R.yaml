# v37_bugfixes_1500R — long-horizon post-audit training on a single H20.
#
# Continuation of v36_bugfixes_100R (peak win=0.836 @ R50, but end-of-run dip
# to 0.320 at R100 showed the policy was far from a stable optimum).
# Same bug-fixed code path as v36 (all F-1/F-3/F-6/F-7/BUG-J/K/L/N/O applied
# and validated by 961 tests). The only deltas versus v36 are:
#
#   * total_rollouts  : 100   → 1500   (15× longer horizon)
#   * eval_every      : 5     → 25     (~60 eval points, readable curve)
#   * save_every      : 25    → 100
#   * log_every       : 2     → 5      (keep log file small over 15k lines)
#   * save_dir        : exps/v37_bugfixes_1500R
#   * seed            : 137   (fresh seed, distinct from v36=136)
#
# Everything else (num_envs=256, net/belief/arr dims, PPO hyper-params,
# reward_shaping=on, train_value_on_random_seats=false, lr_schedule_unit=rollout,
# early_stop disabled) mirrors v36 so this run is a clean long-horizon extension.
#
# Expected wall-clock: v36 was ~47s / rollout (4678s / 100R on H20), so
# 1500R ≈ 19.5h. The H20 has ~93GB free so no OOM risk.

env:
  num_envs: 256
  steps_per_env: 512
  max_num_moves: 4000
  seed: 137
  use_gpu_rollout: true

net:
  cnn_channels: 96
  cnn_layers: 3
  depth: 6
  embed_dim: 192
  n_head: 6
  ff_factor: 4
  dropout: 0.0
  use_cat_vf: true
  action_key_dim: 48
  pos_emb_std: 0.02

belief:
  enabled: true
  buffer_capacity: 50000
  ema_decay: 0.999
  infer_chunk_size: 256
  refresh_every: 5
  warmup_rollouts: 20
  net:
    n_encoder_layer: 6    # F-1
    embed_dim: 512
    n_head: 8
    ff_factor: 4
    dropout: 0.1
  ppo: null

arr:
  enabled: true
  n_arr: 1024
  refresh_every: 1
  storage_duration: 300
  ema_decay: 0.999
  reg_norm: 10.0
  reg_temp_init: 0.1
  reg_temp_floor: 0.0
  reg_temp_decay: 0.3
  net:
    depth: 4
    dropout: 0.0
    embed_dim: 512
    ff_factor: 4
    n_head: 8
    n_vf_cat: 3
    pos_emb_std: 0.1
    use_cat_vf: true
  ppo:
    autocast_dtype: bfloat16
    batch_size: 256
    clip_range: 0.2
    ent_pred_coef: 0.5
    kl_coef: 0.1
    lr: 0.0003
    max_grad_norm: 0.5
    num_epoch_per_train: 4
    policy_coef: 1.0
    vf_coef: 0.5
    weight_decay: 0.0

ppo:
  clip_range: 0.2
  vf_coef: 1.0
  policy_coef: 1.0
  temperature_coef: 0.05
  temperature_ceil: 0.1
  temperature_floor: 0.001
  temperature_decay: 0.3
  uniform_magnet: true
  kl_coef: 0.1
  gamma: 1.0
  gae_lambda: 0.5
  td_lambda: 0.8
  adv_filt_thresh: 0.01
  adv_filt_rate: 0.75
  lr_coef: 0.5
  lr_decay: 1.1
  lr_ceil: 1.0e-4
  lr_floor: 5.0e-6
  lr_schedule_unit: "rollout"   # F-3
  weight_decay: 0.0
  max_grad_norm: 0.5
  ema_decay: 0.999
  num_epochs_per_rollout: 4
  minibatch_size: 1024
  dtype: "bfloat16"
  torch_compile: false

save_dir: "exps/v37_bugfixes_1500R"
total_rollouts: 1500
save_every: 100
eval_every: 25
log_every: 5

# Early-stop disabled — we want to observe the full curve.
early_stop_min_rollout: 2000
early_stop_patience: 5
early_stop_win_rate: 0.0

use_wandb: false
seed: 137
device: "cuda"
torch_deterministic: false
resume: ""

random_opponent: true
train_value_on_random_seats: false   # F-4 (legacy behaviour — empirically best)
reward_shaping: true                  # F-6
